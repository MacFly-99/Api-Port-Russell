<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Utilisateurs - Russell Harbor</title>
</head>
<body>

<script>
    fetch('navbar.html')
        .then(response => response.text())
        .then(data => {
            document.body.insertAdjacentHTML('afterbegin', data);
        })
        .catch(err => console.error("Erreur navbar :", err));
</script>

  <h2>Liste des Utilisateurs</h2>

      <p id="current-date" style="font-size: 1.1rem; opacity: 0.9; margin-bottom: 30px;"></p>

        <button onclick="loadUsers()" class="btn-primary">Rafraîchir la liste</button>
        <button onclick="openCreateUserModal()" class="btn-primary">Créer un utilisateur</button>

  <table id="usersTable">
    <thead>
      <tr>
        <th>Username</th>
        <th>Email</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';

    async function loadUsers() {
      const tbody = document.querySelector('#usersTable tbody');
      tbody.innerHTML = '<tr><td colspan="3" class="empty">Chargement...</td></tr>';

      try {
        const res = await fetch('http://localhost:3000/api/users', {
          headers: { 'Authorization': 'Bearer ' + token }
        });

        const users = await res.json();
        tbody.innerHTML = '';

        if (users.length === 0) {
          tbody.innerHTML = `<tr><td colspan="3" class="empty">Aucun utilisateur trouvé</td></tr>`;
          return;
        }

        users.forEach(user => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${user.username}</td>
            <td>${user.email}</td>
            <td>
              <button onclick="deleteUser('${user.email}')" style="background:#ff4444; color:white; padding:5px 10px;">Supprimer</button>
            </td>
          `;
          tbody.appendChild(row);
        });
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="3" class="empty">Erreur lors du chargement</td></tr>`;
      }
    }

    async function deleteUser(email) {
      if (!confirm(`Supprimer l'utilisateur ${email} ?`)) return;

      try {
        const res = await fetch(`http://localhost:3000/api/users/${email}`, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (res.ok) {
          alert("Utilisateur supprimé");
          loadUsers(); // Rafraîchir la liste
        } else {
          alert("Erreur lors de la suppression");
        }
      } catch (err) {
        alert("Erreur serveur");
      }
    }

    // Charger la liste au démarrage
    window.onload = loadUsers;

    // Afficher le nom de l'utilisateur connecté
async function loadUserInfo() {
    try {
        const res = await fetch('http://localhost:3000/api/users/me', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
            const user = await res.json();
            document.getElementById('username-display').textContent = user.username || "Capitaine";
        }
    } catch(e) {}
}
// Ouvrir le modal
function openCreateUserModal() {
    document.getElementById('createUserModal').style.display = 'flex';
    // Réinitialiser les champs
    document.getElementById('newUsername').value = '';
    document.getElementById('newEmail').value = '';
    document.getElementById('newPassword').value = '';
}

// Fermer le modal
function closeUserModal() {
    document.getElementById('createUserModal').style.display = 'none';
}

// Créer l'utilisateur
async function submitCreateUser() {
    const username = document.getElementById('newUsername').value.trim();
    const email    = document.getElementById('newEmail').value.trim();
    const password = document.getElementById('newPassword').value;

    if (!username || !email || !password) {
        alert("Tous les champs sont obligatoires");
        return;
    }

    if (password.length < 6) {
        alert("Le mot de passe doit contenir au moins 6 caractères");
        return;
    }

    try {
        const res = await fetch('http://localhost:3000/api/users', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                username: username,
                email: email,
                password: password
            })
        });

        if (res.ok) {
            alert("✅ Utilisateur créé avec succès !");
            closeUserModal();
            loadUsers();        // Rafraîchit la liste
        } else {
            const errorData = await res.json().catch(() => ({}));
            alert(`❌ Erreur : ${errorData.message || "Impossible de créer l'utilisateur"}`);
        }
    } catch (err) {
        console.error(err);
        alert("Erreur de connexion au serveur");
    }
}

// Afficher la date sur le dashboard
const now = new Date();
const dateOptions = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
document.getElementById('current-date').textContent = 
    `Aujourd'hui : ${now.toLocaleDateString('fr-FR', dateOptions)}`;
  </script>
  <!-- Modal Créer Utilisateur -->
<div id="createUserModal" class="modal">
    <div class="modal-content">
        <h3>Créer un nouvel Utilisateur</h3>
        
        <label>Nom d'utilisateur (username) :</label>
        <input type="text" id="newUsername" placeholder="Ex: capitaine_dupont" required>

        <label>Adresse email :</label>
        <input type="email" id="newEmail" placeholder="Ex: dupont@example.com" required>

        <label>Mot de passe :</label>
        <input type="password" id="newPassword" placeholder="Mot de passe (min 6 caractères)" required>

        <div class="modal-buttons">
            <button onclick="closeUserModal()" class="btn-secondary">Annuler</button>
            <button onclick="submitCreateUser()" class="btn-primary">Créer l'utilisateur</button>
        </div>
    </div>
</div>
</body>
</html>
