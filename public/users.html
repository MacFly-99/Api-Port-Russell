<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utilisateurs - Russell Harbor</title>
  <style>
    body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #0a2a4a, #1e3a5f); color: white; margin: 0; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: rgba(0,0,0,0.3); padding: 15px 20px; border-radius: 10px; }
    button { padding: 10px 18px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
    .btn-primary { background: #00aaff; color: white; }
    table { width: 100%; border-collapse: collapse; background: rgba(255,255,255,0.1); margin-top: 20px; border-radius: 10px; overflow: hidden; }
    th, td { padding: 14px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.2); }
    th { background: #00aaff; }
    .empty { text-align: center; padding: 40px; color: #aaa; font-style: italic; }
  </style>
</head>
<body>
  <div class="header">
    <h1>👥 Gestion des Utilisateurs</h1>
    <button onclick="window.location.href='dashboard.html'" class="btn-primary">Retour au Dashboard</button>
  </div>

  <h2>Liste des Utilisateurs</h2>
  <button onclick="loadUsers()" class="btn-primary">Rafraîchir la liste</button>

  <table id="usersTable">
    <thead>
      <tr>
        <th>Username</th>
        <th>Email</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';

    async function loadUsers() {
      const tbody = document.querySelector('#usersTable tbody');
      tbody.innerHTML = '<tr><td colspan="3" class="empty">Chargement...</td></tr>';

      try {
        const res = await fetch('http://localhost:3000/api/users', {
          headers: { 'Authorization': 'Bearer ' + token }
        });

        const users = await res.json();
        tbody.innerHTML = '';

        if (users.length === 0) {
          tbody.innerHTML = `<tr><td colspan="3" class="empty">Aucun utilisateur trouvé</td></tr>`;
          return;
        }

        users.forEach(user => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${user.username}</td>
            <td>${user.email}</td>
            <td>
              <button onclick="deleteUser('${user.email}')" style="background:#ff4444; color:white; padding:5px 10px;">Supprimer</button>
            </td>
          `;
          tbody.appendChild(row);
        });
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="3" class="empty">Erreur lors du chargement</td></tr>`;
      }
    }

    async function deleteUser(email) {
      if (!confirm(`Supprimer l'utilisateur ${email} ?`)) return;

      try {
        const res = await fetch(`http://localhost:3000/api/users/${email}`, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (res.ok) {
          alert("Utilisateur supprimé");
          loadUsers(); // Rafraîchir la liste
        } else {
          alert("Erreur lors de la suppression");
        }
      } catch (err) {
        alert("Erreur serveur");
      }
    }

    // Charger la liste au démarrage
    window.onload = loadUsers;
  </script>
</body>
</html>
