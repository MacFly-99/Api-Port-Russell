<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Réservations - Russell Harbor</title>
</head>
<body>
    
<script>
    fetch('navbar.html')
        .then(response => response.text())
        .then(data => {
            document.body.insertAdjacentHTML('afterbegin', data);
        })
        .catch(err => console.error("Erreur navbar :", err));
</script>

  <h2>Réservations par Catway</h2>

        <p id="current-date" style="font-size: 1.1rem; opacity: 0.9; margin-bottom: 30px;"></p>

  <div>
    <input type="number" id="catwayNumber" placeholder="Numéro du catway" value="1">
    <button onclick="loadReservations()" class="btn-primary">Charger les réservations</button>
    <button onclick="openCreateReservationModal()" class="btn-primary">Créer une réservation</button>
  </div>

  <table id="reservationsTable">
    <thead>
      <tr>
        <th>Client</th>
        <th>Bateau</th>
        <th>Date début</th>
        <th>Date fin</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';

    async function loadReservations() {
      const catwayNumber = document.getElementById('catwayNumber').value.trim();
      if (!catwayNumber) {
        alert("Veuillez entrer un numéro de catway");
        return;
      }

      const tbody = document.querySelector('#reservationsTable tbody');
      tbody.innerHTML = '<tr><td colspan="4" class="empty">Chargement en cours...</td></tr>';

      try {
        const res = await fetch(`http://localhost:3000/api/catways/${catwayNumber}/reservations`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (!res.ok) throw new Error("Erreur lors du chargement");

        const reservations = await res.json();
        tbody.innerHTML = '';

        if (reservations.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" class="empty">Aucune réservation trouvée pour le catway ${catwayNumber}</td></tr>`;
          return;
        }

        reservations.forEach(r => {
          // Gestion robuste des dates (même si elles sont en string ISO)
          const startDate = r.startDate ? new Date(r.startDate).toLocaleDateString('fr-FR') : 'Non définie';
          const endDate = r.endDate ? new Date(r.endDate).toLocaleDateString('fr-FR') : 'Non définie';

          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${r.clientName || '-'}</td>
            <td>${r.boatName || '-'}</td>
            <td>${startDate}</td>
            <td>${endDate}</td>
          `;
          tbody.appendChild(row);
        });
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="4" class="empty">Erreur : ${err.message}</td></tr>`;
        console.error(err);
      }
    }

    // Charger automatiquement les réservations du catway 1 au chargement
    window.onload = loadReservations;
    
    // Ouvrir le modal
function openCreateReservationModal() {
    document.getElementById('createReservationModal').style.display = 'flex';
    
    // Optionnel : pré-remplir avec le numéro du catway actuellement saisi
    const currentCatway = document.getElementById('catwayNumber').value;
    if (currentCatway) {
        document.getElementById('resCatwayNumber').value = currentCatway;
    }
}

// Fermer le modal
function closeReservationModal() {
    document.getElementById('createReservationModal').style.display = 'none';
}

// Soumettre la création
async function submitCreateReservation() {
    const catwayNumber = parseInt(document.getElementById('resCatwayNumber').value);
    const clientName   = document.getElementById('clientName').value.trim();
    const boatName     = document.getElementById('boatName').value.trim();
    const startDate    = document.getElementById('startDate').value;
    const endDate      = document.getElementById('endDate').value;

    if (!catwayNumber || !clientName || !boatName || !startDate || !endDate) {
        alert("Tous les champs sont obligatoires");
        return;
    }

    try {
        const res = await fetch(`http://localhost:3000/api/catways/${catwayNumber}/reservations`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                clientName: clientName,
                boatName: boatName,
                startDate: startDate,
                endDate: endDate
            })
        });

        if (res.ok) {
            alert("✅ Réservation créée avec succès !");
            closeReservationModal();
            loadReservations();   // Rafraîchit la liste
        } else {
            const errorData = await res.json().catch(() => ({}));
            alert(`❌ Erreur : ${errorData.message || "Impossible de créer la réservation"}`);
        }
    } catch (err) {
        console.error(err);
        alert("Erreur de connexion au serveur");
    }

    // Afficher le nom de l'utilisateur connecté
async function loadUserInfo() {
    try {
        const res = await fetch('http://localhost:3000/api/users/me', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
            const user = await res.json();
            document.getElementById('username-display').textContent = user.username || "Capitaine";
        }
    } catch(e) {}
 }
}

// Afficher la date sur le dashboard
const now = new Date();
const dateOptions = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
document.getElementById('current-date').textContent = 
    `Aujourd'hui : ${now.toLocaleDateString('fr-FR', dateOptions)}`;
  </script>
  <!-- Modal Créer Réservation -->
<div id="createReservationModal" class="modal">
    <div class="modal-content">
        <h3>Créer une nouvelle Réservation</h3>
        
        <label>Numéro du catway :</label>
        <input type="number" id="resCatwayNumber" min="1" placeholder="Ex: 1" required>

        <label>Nom du client :</label>
        <input type="text" id="clientName" placeholder="Ex: Jean Dupont" required>

        <label>Nom du bateau :</label>
        <input type="text" id="boatName" placeholder="Ex: Sea Spirit" required>

        <label>Date de début :</label>
        <input type="date" id="startDate" required>

        <label>Date de fin :</label>
        <input type="date" id="endDate" required>

        <div class="modal-buttons">
            <button onclick="closeReservationModal()" class="btn-secondary">Annuler</button>
            <button onclick="submitCreateReservation()" class="btn-primary">Créer la réservation</button>
        </div>
    </div>
</div>
</body>
</html>
