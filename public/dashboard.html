<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord - Russell Harbor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0a2a4a, #1e3a5f);
      color: white;
      margin: 0;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      background: rgba(0,0,0,0.3);
      padding: 20px;
      border-radius: 12px;
    }
    h1 { margin: 0; font-size: 28px; }
    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .card {
      background: rgba(255,255,255,0.1);
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      transition: transform 0.2s;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-8px);
      background: rgba(255,255,255,0.15);
    }
    .card h3 {
      margin: 15px 0 10px 0;
      font-size: 22px;
    }
    button {
      padding: 12px 25px;
      background: #ff4444;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { background: #cc0000; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🚤 Russell Harbor - Capitainerie</h1>
    <div>
      <span id="username" style="margin-right: 25px; font-size: 18px;"></span>
      <button onclick="logout()">Déconnexion</button>
    </div>
  </div>

  <h2>Bienvenue sur le Tableau de bord</h2>
  <p id="date" style="margin-bottom: 30px; opacity: 0.9;"></p>
  
    <div class="card" onclick="window.location.href='catways.html'">
    <h3>📋 Catways</h3>
    <p>Voir et modifier l'état des catways</p>
    </div>

    <div class="card" onclick="window.location.href='reservations.html'">
      <h3>📅 Réservations</h3>
      <p>Voir et gérer les réservations par catway</p>
    </div>

    <div class="card" onclick="window.location.href='users.html'">
      <h3>👥 Utilisateurs</h3>
      <p>Gérer les comptes de la capitainerie</p>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = 'login.html';
    }

    // Afficher le nom de l'utilisateur et la date actuelle
    function updateHeader() {
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        document.getElementById('username').textContent = `👤 ${payload.username || payload.email}`;
      } catch (e) {
        document.getElementById('username').textContent = '👤 Utilisateur connecté';
      }

      const now = new Date();
      document.getElementById('date').textContent = 
        `Aujourd'hui : ${now.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}`;
    }

    function logout() {
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    }

    // Initialisation
    window.onload = updateHeader;
  </script>
</body>
</html>
