<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Tableau de bord - Russell Harbor</title>
</head>
<body class="dashboard-page">
  
<!-- === NAVBAR COMMUNE === -->
<script>
    fetch('navbar.html')
        .then(response => response.text())
        .then(data => {
            document.body.insertAdjacentHTML('afterbegin', data);
        })
        .catch(err => console.error("Erreur navbar :", err));
</script>

  <h2>Bienvenue sur le Tableau de bord</h2>

      <p id="current-date" style="font-size: 1.1rem; opacity: 0.9; margin-bottom: 30px;"></p>

    <div class="card" onclick="window.location.href='catways.html'">
    <h3>📋 Catways</h3>
    <p>Voir et modifier l'état des catways</p>
    </div>

    <div class="card" onclick="window.location.href='reservations.html'">
      <h3>📅 Réservations</h3>
      <p>Voir et gérer les réservations par catway</p>
    </div>

    <div class="card" onclick="window.location.href='users.html'">
      <h3>👥 Utilisateurs</h3>
      <p>Gérer les comptes de la capitainerie</p>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = 'login.html';
    }

    // Afficher le nom de l'utilisateur et la date actuelle
    function updateHeader() {
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        document.getElementById('username').textContent = `👤 ${payload.username || payload.email}`;
      } catch (e) {
        document.getElementById('username').textContent = '👤 Utilisateur connecté';
      }

      const now = new Date();
      document.getElementById('date').textContent = 
        `Aujourd'hui : ${now.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}`;
    }

    function logout() {
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    }

    // Initialisation
    window.onload = updateHeader;
    
    // Afficher le nom de l'utilisateur connecté
async function loadUserInfo() {
    try {
        const res = await fetch('http://localhost:3000/api/users/me', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
            const user = await res.json();
            document.getElementById('username-display').textContent = user.username || "Capitaine";
        }
    } catch(e) {}
}

// Afficher la date sur le dashboard
const now = new Date();
const dateOptions = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
document.getElementById('current-date').textContent = 
    `Aujourd'hui : ${now.toLocaleDateString('fr-FR', dateOptions)}`;
  </script>
</body>
</html>
