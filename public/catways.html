<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Catways - Russell Harbor</title>
</head>
<body>
    
<script>
    fetch('navbar.html')
        .then(response => response.text())
        .then(data => {
            document.body.insertAdjacentHTML('afterbegin', data);
        })
        .catch(err => console.error("Erreur navbar :", err));
</script>

  <h2>Liste des Catways</h2>

      <p id="current-date" style="font-size: 1.1rem; opacity: 0.9; margin-bottom: 30px;"></p>

  <button onclick="loadCatways()" class="btn-primary">Rafraîchir la liste</button>
  <button onclick="openCreateCatwayModal()" class="btn-primary">Créer un catway</button>
  
  <table id="catwaysTable">
    <thead>
      <tr>
        <th>Numéro</th>
        <th>Type</th>
        <th>État</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';

    async function loadCatways() {
      const tbody = document.querySelector('#catwaysTable tbody');
      tbody.innerHTML = '<tr><td colspan="4" class="empty">Chargement des 24 catways...</td></tr>';

      try {
        const res = await fetch('http://localhost:3000/api/catways', {
          headers: { 
            'Authorization': `Bearer ${token}` 
          }
        });

        console.log("Réponse status:", res.status);

        const catways = await res.json();
        console.log("Nombre de catways reçus:", catways.length);

        tbody.innerHTML = '';

        if (catways.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" class="empty">Aucun catway trouvé.<br>Tu as pourtant 24 catways dans Compass.</td></tr>`;
          return;
        }

        catways.forEach(c => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td><strong>${c.catwayNumber}</strong></td>
            <td>${c.catwayType}</td>
            <td>${c.catwayState}</td>
            <td>
              <button onclick="updateCatwayState(${c.catwayNumber})" class="btn-primary">Modifier État</button>
            </td>
          `;
          tbody.appendChild(row);
        });
      } catch (err) {
        console.error(err);
        const tbody = document.querySelector('#catwaysTable tbody');
        tbody.innerHTML = `<tr><td colspan="4" class="empty">Erreur : ${err.message}</td></tr>`;
      }
    }

// Ouvrir le modal
function openCreateCatwayModal() {
    document.getElementById('createCatwayModal').style.display = 'flex';
    // Réinitialiser les champs
    document.getElementById('catwayNumber').value = '';
    document.getElementById('catwayState').value = 'bon état';
}

// Fermer le modal
function closeModal() {
    document.getElementById('createCatwayModal').style.display = 'none';
}

// Soumettre la création
async function submitCreateCatway() {
    const numberInput = document.getElementById('catwayNumber').value;
    const type = document.getElementById('catwayType').value;
    const state = document.getElementById('catwayState').value.trim();

    if (!numberInput) {
        alert("Veuillez entrer un numéro de catway");
        return;
    }

    const catwayNumber = parseInt(numberInput);

    try {
        const res = await fetch('http://localhost:3000/api/catways', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                catwayNumber: catwayNumber,
                catwayType: type,
                catwayState: state || "bon état"
            })
        });

        if (res.ok) {
            alert("✅ Catway créé avec succès !");
            closeModal();
            loadCatways();   // Rafraîchit automatiquement la liste
        } else {
            const errorData = await res.json().catch(() => ({}));
            alert(`❌ Erreur : ${errorData.message || "Impossible de créer le catway"}`);
        }
    } catch (err) {
        console.error(err);
        alert("Erreur de connexion au serveur");
    }
}

    async function updateCatwayState(catwayNumber) {
      const newState = prompt("Nouvel état :", "disponible");
      if (!newState) return;

      try {
        await fetch(`http://localhost:3000/api/catways/${catwayNumber}`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ catwayState: newState })
        });
        loadCatways();
      } catch (err) {
        alert("Erreur");
      }
    }

    window.onload = loadCatways;

    // Afficher le nom de l'utilisateur connecté
async function loadUserInfo() {
    try {
        const res = await fetch('http://localhost:3000/api/users/me', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
            const user = await res.json();
            document.getElementById('username-display').textContent = user.username || "Capitaine";
        }
    } catch(e) {}
}

// Afficher la date sur le dashboard
const now = new Date();
const dateOptions = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
document.getElementById('current-date').textContent = 
    `Aujourd'hui : ${now.toLocaleDateString('fr-FR', dateOptions)}`;
  </script>
  <!-- Modal Créer Catway -->
<div id="createCatwayModal" class="modal">
    <div class="modal-content">
        <h3>Créer un nouveau Catway</h3>
        
        <label>Numéro du catway :</label>
        <input type="number" id="catwayNumber" min="1" placeholder="Ex: 26" required>

        <label>Type :</label>
        <select id="catwayType">
            <option value="short">Short</option>
            <option value="long">Long</option>
        </select>

        <label>État initial :</label>
        <input type="text" id="catwayState" value="bon état" placeholder="Ex: bon état, en maintenance...">

        <div class="modal-buttons">
            <button onclick="closeModal()" class="btn-secondary">Annuler</button>
            <button onclick="submitCreateCatway()" class="btn-primary">Créer le catway</button>
        </div>
    </div>
</div>
</body>
</html>
