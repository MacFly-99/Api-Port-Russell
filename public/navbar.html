<script>
    // Fonction commune pour afficher utilisateur + date
    async function updateHeader() {
        const token = localStorage.getItem('token');
        if (!token) return;

        // Nom de l'utilisateur
        try {
            const res = await fetch('http://localhost:3000/api/users/me', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                const user = await res.json();
                document.getElementById('username-display').innerHTML = `👤 ${user.username || "Capitaine"}`;
            }
        } catch (e) {
            document.getElementById('username-display').textContent = "👤 Utilisateur";
        }
    }

    function logout() {
        localStorage.removeItem('token');
        window.location.href = 'login.html';
    }

    // Exécuter updateHeader une fois la navbar chargée
    setTimeout(updateHeader, 300);
</script>
